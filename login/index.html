<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Webpage</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR (Home | Section1) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#home">Home</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#section1">Section 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#section2">Section 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="#section3">Section 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="#section4">Section 4</a></li>
                    <li class="nav-item"><a class="nav-link" href="#section5">Section 5</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">

        <!-- SLIDER -->
        <div id="carouselExampleIndicators" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/imagen/japon.jpg" class="d-block w-100" alt="japon" height="300" width="400">
    </div>
    <div class="carousel-item">
      <img src="/imagen/corea.jpg" class="d-block w-100" alt="corea" height="300" width="400">
    </div>
    <div class="carousel-item">
      <img src="/imagen/suiza.jpg" class="d-block w-100" alt="suiza" height="300" width="400">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

        <!-- PARAGRAPH -->
        <div class="p-4 bg-light border">
            <p>
                Paisajes
            </p>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        Footer
    </footer>

    <!-- section   -->
<section id="section1" class="p-5 bg-light">
        <div class="container">
            <h2>Section 1</h2>
            <p>Contenido de la sección 1</p>
        </div>
    </section>

    <section id="section2" class="p-5 bg-secondary text-white">
        <div class="container">
            <h2>Section 2</h2>
            <p>Contenido de la sección 2</p>
        </div>
    </section>

    <section id="section3" class="p-5 bg-light">
        <div class="container">
            <h2>Section 3</h2>
            <p>Contenido de la sección 3</p>
        </div>
    </section>

    <section id="section4" class="p-5 bg-secondary text-white">
        <div class="container">
            <h2>Section 4</h2>
            <p>Contenido de la sección 4</p>
        </div>
    </section>

    <section id="section5" class="p-5 bg-light">
        <div class="container">
            <h2>Section 5</h2>
            <p>Contenido de la sección 5</p>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
